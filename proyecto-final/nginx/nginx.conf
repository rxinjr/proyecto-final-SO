# Formato de log propio: nos dice a QUÉ backend se envió cada petición
log_format lb '$remote_addr -> upstream=$upstream_addr "$request" '
              'status=$status tiempo=$request_time s';

# Pool de backends. "app1" y "app2" son nombres de servicio de docker-compose:
# Docker los resuelve a la IP de cada contenedor.
upstream backend_pool {
    server app1:5000;
    server app2:5000;
    server app3:5000;
}

server {
    listen 80;
    access_log /dev/stdout lb;

    location / {
        proxy_pass http://backend_pool;

        # Cabeceras para que el backend sepa quién es el cliente real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tolerancia a fallos: si un backend no responde, pasa al siguiente
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Cabecera de depuración: IP:puerto del backend que atendió
        add_header X-Upstream $upstream_addr always;
    }
}

# Puerto interno de métricas (NO se publica en docker-compose).
# Lo lee nginx-exporter para convertirlo al formato de Prometheus.
server {
    listen 8088;
    access_log off;

    location /stub_status {
        stub_status;
    }
}
