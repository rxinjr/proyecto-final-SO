services:
  app1:
    build: ./backend
    environment:
      SERVER_NAME: "server 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - proyecto_red

  app2:
    build: ./backend
    environment:
      SERVER_NAME: "server 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - proyecto_red

  app3:
    build: ./backend
    environment:
      SERVER_NAME: "server 3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - proyecto_red

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - proyecto_red

  artillery:
    image: artilleryio/artillery:latest
    profiles: ["test"]
    volumes:
      - .:/scripts
    command: run /scripts/performance-test.yml
    depends_on:
      - nginx
    networks:
      - proyecto_red

networks:
  proyecto_red:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

